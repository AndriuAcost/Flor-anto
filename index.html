<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramo de flores amarillas para Antonella</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #fff8e7 0%, #fdf1d6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .stage {
    position: relative;
    width: min(680px, 92vw);
    background: #ffffff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .bouquet { transform-box: fill-box; transform-origin: bottom center; animation: sway 4s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }

  /* the flower group itself only rotates/sways gently - position (translate) stays on the parent <g>, untouched */
  .flower { transform-box: fill-box; transform-origin: center; }
  .flower.f1 { animation: nod 3.2s ease-in-out infinite; }
  .flower.f2 { animation: nod 3.2s ease-in-out infinite 0.35s; }
  .flower.f3 { animation: nod 3.2s ease-in-out infinite 0.7s; }
  .flower.f4 { animation: nod 3.2s ease-in-out infinite 1.05s; }
  .flower.f5 { animation: nod 3.2s ease-in-out infinite 1.4s; }
  .flower.f6 { animation: nod 3.2s ease-in-out infinite 1.75s; }
  .flower.f7 { animation: nod 3.2s ease-in-out infinite 2.1s; }
  @keyframes nod {
    0%, 100% { transform: rotate(-4deg) scale(1); }
    50%      { transform: rotate(4deg) scale(1.04); }
  }

  /* each petal breathes outward from its own center - safe because it has no conflicting attribute transform */
  .petal { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(0.92); }
    50%      { transform: scale(1.08); }
  }

  /* the flower center also pulses, slightly out of phase */
  .center-dot { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  .petal-fall { position: absolute; top: -20px; font-size: 16px; opacity: 0.85; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10% { opacity: 0.9; }
    100% { transform: translateY(520px) rotate(360deg); opacity: 0; }
  }

  .butterfly { position: absolute; font-size: 22px; animation: flutter 7s ease-in-out infinite; }
  .butterfly.b2 { animation-duration: 9s; animation-delay: 1.5s; }
  @keyframes flutter {
    0%   { top: 60px; left: 10%; transform: rotate(0deg); }
    20%  { top: 100px; left: 70%; transform: rotate(10deg); }
    40%  { top: 40px; left: 40%; transform: rotate(-8deg); }
    60%  { top: 130px; left: 85%; transform: rotate(6deg); }
    80%  { top: 70px; left: 20%; transform: rotate(-4deg); }
    100% { top: 60px; left: 10%; transform: rotate(0deg); }
  }

  .sparkle { position: absolute; font-size: 14px; animation: twinkle 2.2s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .label {
    text-align: center;
    margin-top: 4px;
    font-family: 'Brush Script MT', cursive, 'Segoe UI', sans-serif;
    font-size: 30px;
    color: #b5772e;
  }
</style>
</head>
<body>
<div class="stage">

  <div class="butterfly" style="color:#e0722f;">🦋</div>
  <div class="butterfly b2" style="color:#f2955a;">🦋</div>

  <div class="petal-fall" style="left:8%; animation-duration: 6s;">🌼</div>
  <div class="petal-fall" style="left:25%; animation-duration: 8s; animation-delay: 1s;">🌼</div>
  <div class="petal-fall" style="left:50%; animation-duration: 7s; animation-delay: 2s;">🌼</div>
  <div class="petal-fall" style="left:70%; animation-duration: 9s; animation-delay: 0.5s;">🌼</div>
  <div class="petal-fall" style="left:88%; animation-duration: 6.5s; animation-delay: 1.8s;">🌼</div>

  <div class="sparkle" style="top:30px; left:15%; animation-delay:0s;">✨</div>
  <div class="sparkle" style="top:60px; left:80%; animation-delay:0.7s;">✨</div>
  <div class="sparkle" style="top:20px; left:55%; animation-delay:1.3s;">✨</div>

<g transform="rotate(72)"><ellipse class="petal" cx="0" cy="-22" rx="12" ry="20" fill="url(#petalShine)"/></g>

</html>
